server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad (M12). Las de la API las pone helmet; estas cubren
  # el HTML y los estáticos. Una `location` con su propio `add_header` no hereda
  # las del servidor: por eso se repiten en la de assets.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  server_tokens off;

  # SPA fallback — todas las rutas devuelven index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache largo para assets estáticos
  location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Proxy al API
  location /api/ {
    # El DNS interno de Docker (127.0.0.11) se vuelve a consultar cada 10 s, así
    # que si el contenedor del API se recrea con otra IP nginx deja de pegarle a
    # la vieja. Sin esto nginx resuelve `api` UNA sola vez al arrancar y sigue
    # devolviendo 502 ("connection refused") hasta que se reinicie nginx, aunque
    # el API ya esté sano. `proxy_pass` con variable además permite que nginx
    # arranque aunque el API todavía no exista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:4001;
    proxy_pass $api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
