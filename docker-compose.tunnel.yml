# Publica el stack (web + api + postgres) por Cloudflare Tunnel.
#
# Uso rápido (URL temporal *.trycloudflare.com, sin cuenta):
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
#   docker compose logs -f cloudflared      # muestra la URL pública
#
# Con dominio propio (túnel con nombre):
#   1) En Cloudflare Zero Trust → Networks → Tunnels, crea un túnel y copia el token.
#   2) Crea un Public Hostname: <tu-subdominio> → Service: http://web:80
#   3) Comenta el `command` de abajo y exporta el token:
#        export CLOUDFLARE_TUNNEL_TOKEN=<token>
#      con:  command: tunnel --no-autoupdate run

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cyc-tunnel
    restart: unless-stopped
    # URL temporal para demos. Para dominio propio, ver la cabecera del archivo.
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
