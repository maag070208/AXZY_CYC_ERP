name: axzy-cyc-erp

# Monorepo AXZY CYC ERP — Sistema de Gestión Escolar.
# Levanta todo con:  docker compose up --build -d
# Variables configurables en `.env` (copia `.env.example`).

services:
  postgres:
    image: postgres:16-alpine
    container_name: cyc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyc}
      POSTGRES_USER: ${POSTGRES_USER:-cyc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyc_dev_pwd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyc} -d ${POSTGRES_DB:-cyc}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    image: axzy-cyc-api:local
    container_name: cyc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyc}:${POSTGRES_PASSWORD:-cyc_dev_pwd}@postgres:5432/${POSTGRES_DB:-cyc}?schema=public
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      # Límite de peticiones por IP en login y recuperación de contraseña (M12).
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-20}
      RATE_LIMIT_PUBLIC_MAX: ${RATE_LIMIT_PUBLIC_MAX:-30}
      # La web (nginx) hace de proxy: un salto para conocer la IP real del cliente.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Cambiar-2026!}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Expediente: disco local con volumen (o "s3" con las credenciales de abajo).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage/private
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      # S3 compatible alterno (MinIO/otros); vacío = AWS.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      ABLY_API_KEY: ${ABLY_API_KEY:-}
    volumes:
      - apistorage:/app/storage
    ports:
      - "${API_PORT:-4001}:4001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: axzy-cyc-web:local
    container_name: cyc-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      WEB_API_URL: ${WEB_API_URL:-/api/v1}
    ports:
      - "${WEB_PORT:-8080}:80"

  # Respaldo programado (M12): `pg_dump` en formato custom + archivos del
  # expediente, con retención. Restaurar: `pnpm --dir api restore <archivo.dump>`.
  backup:
    image: postgres:16-alpine
    container_name: cyc-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cyc}
      PGUSER: ${POSTGRES_USER:-cyc}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cyc_dev_pwd}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # 0 = un solo respaldo y termina (útil para probar o para un cron externo).
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - apistorage:/storage:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          name="cyc-$$(date +%Y%m%d-%H%M%S)"
          if pg_dump -Fc --no-owner -f "/backups/$$name.dump"; then
            (cd /backups && sha256sum "$$name.dump" > "$$name.dump.sha256")
            if [ -n "$$(ls -A /storage/private 2>/dev/null)" ]; then tar -czf "/backups/$$name-files.tar.gz" -C /storage/private .; fi
            psql -qc "UPDATE settings SET value = to_jsonb(to_char(now() AT TIME ZONE 'UTC', 'YYYY-MM-DD\"T\"HH24:MI:SS.MS\"Z\"')), updated_at = now() WHERE key = 'MIGRATION_LAST_BACKUP_AT'"
            find /backups -name 'cyc-*' -mtime "+$$BACKUP_RETENTION_DAYS" -delete
            echo "[backup] $$name listo"
          else
            echo "[backup] $$name FALLÓ" >&2
          fi
          [ "$$BACKUP_INTERVAL_HOURS" = "0" ] && exit 0
          sleep "$$((BACKUP_INTERVAL_HOURS * 3600))"
        done

volumes:
  pgdata:
  apistorage:
